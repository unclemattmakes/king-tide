version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Rapier 0.20.x reworked the contact solver defaults (erp -> natural
      # frequency, a finite normalized_max_corrective_velocity, and the
      # fast-contact special case removed). Measured against the 600-tick
      # determinism harness on this game, that is NOT a drop-in bump: with
      # byte-identical scripted input the player bike lands 47 cm away in Z
      # with hover height off by 3.8 cm and vertical velocity off by 45%,
      # and every one of the 104 lagoon bodies moves. It changes wave-mastery
      # feel and fixes no advisory, so it needs a deliberate precision-tuning
      # pass + golden reseed rather than a merge. Pinned to 0.20.x only, so
      # 0.21+ still gets raised. See PR #10 for the full measurement.
      - dependency-name: "@dimforge/rapier3d-compat"
        versions: ["0.20.x"]
    groups:
      # `three` is 0.x, so a "minor" here is a breaking render bump. Kept in
      # its own group and triaged like a runtime change, never batched with
      # dev tooling. See docs/dependency-triage.md.
      three-stack:
        patterns:
          - three
          - "@types/three"
      # Routine dev-tooling upgrades. Minor/patch only — mergeable as a batch
      # once `pnpm verify` is green.
      dev-tooling:
        patterns:
          - "@biomejs/*"
          - "@playwright/*"
          - vitest
          - vite
          - vitepress
          - typescript
          - "@types/node"
          - jsdom
          - electron
          - electron-builder
        update-types:
          - minor
          - patch
      # Majors arrive on their own. Splitting them out is not cosmetic: PR #7
      # bundled biome/vite/vitest minors together with typescript 6 -> 7 and
      # @types/node 20 -> 26, which made the whole PR read as "already
      # superseded" when two compiler-level majors were still hiding in it.
      dev-tooling-major:
        patterns:
          - "@biomejs/*"
          - "@playwright/*"
          - vitest
          - vite
          - vitepress
          - typescript
          - "@types/node"
          - jsdom
          - electron
          - electron-builder
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
