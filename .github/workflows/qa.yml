name: qa

# Hoverbike QA report — runs the orchestrator on push + PR, uploads
# the qa-report/ artifact, writes the Markdown summary into the job's
# GitHub Step Summary so reviewers don't have to download the artifact
# to see results. Today this workflow is NON-BLOCKING — failures are
# advisory while v1 art lands and per-track budgets calibrate. See
# docs/qa-playbook.md for the full convention.
#
# The soak step runs nightly on `main` only, on its own schedule.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly at 06:17 UTC. Picked off-peak vs CI windows so we don't
    # collide with the asset-pipeline + build-desktop jobs.
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA report (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Non-blocking while v1 calibrates. `continue-on-error` alone is
    # enough — we don't double-mask with `|| true` on the step itself,
    # because the orchestrator's real exit code is the most diagnostic
    # signal an artifact can carry.
    continue-on-error: true
    env:
      E2E_HEADLESS: '1'
      # Secret mapped to env so step `if:` can read it (the `secrets` context
      # is not available in `if:`). Same pattern as ci.yml's e2e/determinism.
      RCLONE_CONF_BASE64: ${{ secrets.RCLONE_CONF_BASE64 }}

    steps:
      - uses: actions/checkout@v6

      # No `version:` — package.json's `packageManager` pin owns it.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The QA matrix boots every track for real, so it needs the compiled
      # GLBs — which are gitignored and served from R2 (docs/asset-storage.md).
      # Without this the whole matrix fails on missing assets, which is what it
      # did silently for months. Gated on the secret so forks degrade to the
      # skip notice below instead of a misleading red matrix.
      - name: Install rclone
        if: ${{ env.RCLONE_CONF_BASE64 != '' }}
        uses: AnimMouse/setup-rclone@v1

      - name: Hydrate assets from R2
        if: ${{ env.RCLONE_CONF_BASE64 != '' }}
        env:
          RCLONE_CONF_BASE64: ${{ secrets.RCLONE_CONF_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/rclone"
          echo "$RCLONE_CONF_BASE64" | base64 -d > "$RUNNER_TEMP/rclone/rclone.conf"
          export RCLONE_CONFIG="$RUNNER_TEMP/rclone/rclone.conf"
          pnpm assets:pull

      - name: Install Playwright Chromium
        if: ${{ env.RCLONE_CONF_BASE64 != '' }}
        run: pnpm e2e:install

      - name: Run pnpm qa
        # The orchestrator skips Blender-side track-lint by default —
        # `--track-lint` opts in when BLENDER_EXE is on PATH (CI doesn't
        # have Blender, so we don't pass it here).
        if: ${{ env.RCLONE_CONF_BASE64 != '' }}
        run: pnpm qa

      - name: Skip notice (no asset secret)
        if: ${{ env.RCLONE_CONF_BASE64 == '' }}
        run: echo "::warning::RCLONE_CONF_BASE64 not set — skipping the QA matrix (cannot hydrate assets from R2). It runs for real on branches/PRs with the secret."

      - name: Append report to job summary
        if: always()
        run: |
          if [ -f qa-report/qa-report.md ]; then
            cat qa-report/qa-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "QA report missing — see step logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-report
          path: qa-report/
          retention-days: 14

      - name: Upload Playwright HTML report
        # Separate artifact so a triager investigating a matrix cell
        # failure can open trace.zip in the Playwright trace viewer
        # without re-running the suite locally.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  qa-soak:
    name: QA soak (nightly, main only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    env:
      E2E_HEADLESS: '1'
      RCLONE_CONF_BASE64: ${{ secrets.RCLONE_CONF_BASE64 }}

    steps:
      - uses: actions/checkout@v6
      # No `version:` — package.json's `packageManager` pin owns it.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same asset story as the qa job above — the soak boots real tracks.
      - name: Install rclone
        if: ${{ env.RCLONE_CONF_BASE64 != '' }}
        uses: AnimMouse/setup-rclone@v1

      - name: Hydrate assets from R2
        if: ${{ env.RCLONE_CONF_BASE64 != '' }}
        env:
          RCLONE_CONF_BASE64: ${{ secrets.RCLONE_CONF_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/rclone"
          echo "$RCLONE_CONF_BASE64" | base64 -d > "$RUNNER_TEMP/rclone/rclone.conf"
          export RCLONE_CONFIG="$RUNNER_TEMP/rclone/rclone.conf"
          pnpm assets:pull

      - name: Install Playwright Chromium
        if: ${{ env.RCLONE_CONF_BASE64 != '' }}
        run: pnpm e2e:install

      - name: Run pnpm qa --soak
        if: ${{ env.RCLONE_CONF_BASE64 != '' }}
        run: pnpm qa --soak

      - name: Skip notice (no asset secret)
        if: ${{ env.RCLONE_CONF_BASE64 == '' }}
        run: echo "::warning::RCLONE_CONF_BASE64 not set — skipping the QA soak (cannot hydrate assets from R2)."

      - name: Append soak report to job summary
        if: always()
        run: |
          if [ -f qa-report/qa-report.md ]; then
            cat qa-report/qa-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-soak-report
          path: qa-report/
          retention-days: 30
