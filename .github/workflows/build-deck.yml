name: build-deck

# Build the Steam Deck AppImage. Opt-in (manual dispatch + on v* tags)
# because the Rust + Tauri toolchain install is slow (~5 min) — too
# expensive for every PR.
#
# Outputs the AppImage as a workflow artifact. Steam Partner upload
# is intentionally not part of this — once we have an App ID and a
# secret for `steamcmd`, a separate `release-steam.yml` will do that.

on:
  workflow_dispatch:
    inputs:
      steam_feature:
        description: "Build with the `steam` feature (requires STEAM_SDK secret)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    tags:
      - "v*"

concurrency:
  group: build-deck-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    name: Linux AppImage (x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: System libs (webkit2gtk + gtk3)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo + tauri
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.toml') }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - run: pnpm install --frozen-lockfile

      - name: Build web bundle
        run: pnpm build

      - name: Build AppImage
        working-directory: src-tauri
        run: |
          if [ "${{ inputs.steam_feature }}" = "true" ]; then
            cargo tauri build --target x86_64-unknown-linux-gnu --features steam
          else
            cargo tauri build --target x86_64-unknown-linux-gnu
          fi

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoverbike-appimage
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Attach to Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          fail_on_unmatched_files: true
