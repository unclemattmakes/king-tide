name: ci

# Typecheck, lint, unit tests, build, docs build.
# E2E (Playwright) runs in a separate job because it needs a browser install
# and is heavier.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build VitePress site
        run: pnpm docs:build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Informational for now. Flip `continue-on-error` off once it's been green
    # on PRs for a couple of weeks.
    continue-on-error: true
    env:
      E2E_HEADLESS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm e2e:install
      - name: Run e2e
        run: pnpm e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Deploys the PartyKit relay (party/relay.ts) when main moves. Vercel
  # auto-deploys the static client, but the relay is a separate target —
  # without this step the client and server drift apart (we lost a few
  # days of the M10.12 lobby being broken in prod because of exactly that).
  # Requires PARTYKIT_LOGIN + PARTYKIT_TOKEN repo secrets; the step skips
  # cleanly if they're missing so forked PRs don't fail.
  partykit-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy PartyKit relay
        env:
          PARTYKIT_LOGIN: ${{ secrets.PARTYKIT_LOGIN }}
          PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN }}
        run: |
          if [ -z "$PARTYKIT_TOKEN" ]; then
            echo "::warning::PARTYKIT_TOKEN not set — skipping relay deploy. Add PARTYKIT_LOGIN + PARTYKIT_TOKEN secrets to enable."
            exit 0
          fi
          pnpm party:deploy
