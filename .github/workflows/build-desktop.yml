name: build-desktop

# Build the Electron desktop wrappers — a Linux game tree (Steam Deck path)
# and a Windows NSIS installer + game tree (Windows desktop path). Electron
# bundles its own Chromium, so there's no Rust / WebKitGTK toolchain to
# install (the old Tauri path needed both).
#
# Outputs land as workflow artifacts on every run. On `v*` tag pushes the
# Linux tree tarball + Windows installer attach to the GitHub Release.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux tree
            os: ubuntu-22.04
          - label: Windows installer
            os: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ---- Hydrate compiled assets from Cloudflare R2 ---------------------
      # The compiled runtime assets (GLBs/audio/atlases) are gitignored and
      # served from R2 (see docs/asset-storage.md) — a bare checkout has an
      # EMPTY public/assets. Without this, electron-builder happily bundles a
      # broken, asset-less game. We MUST hydrate before the build, and FAIL
      # LOUDLY if the secret that lets us reach R2 is absent — an empty bundle
      # must never be produced silently. (Secret: RCLONE_CONF_BASE64, a
      # base64-encoded rclone.conf with an `r2-hoverbike` S3 remote. See
      # steam/README.md → "Asset hydration secret".)
      - name: Install rclone
        uses: AnimMouse/setup-rclone@v1

      - name: Hydrate assets from R2
        shell: bash
        env:
          RCLONE_CONF_BASE64: ${{ secrets.RCLONE_CONF_BASE64 }}
        run: |
          if [ -z "$RCLONE_CONF_BASE64" ]; then
            echo "::error::RCLONE_CONF_BASE64 secret is not set. Desktop/Steam builds must hydrate public/assets from R2 — refusing to build an empty bundle. Add the secret (base64 of an rclone.conf with the r2-hoverbike remote); see steam/README.md."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/rclone"
          echo "$RCLONE_CONF_BASE64" | base64 -d > "$RUNNER_TEMP/rclone/rclone.conf"
          export RCLONE_CONFIG="$RUNNER_TEMP/rclone/rclone.conf"
          pnpm assets:pull

      # Belt-and-braces: prove the tree actually hydrated before we spend time
      # building. Fails the job if assets are missing / below the GLB floor.
      - name: Verify assets present
        run: node tools/check-assets-present.mjs

      - name: Generate placeholder icons
        run: pnpm gen:icons

      # ---- Linux: build the unpacked game tree ----------------------------
      - name: Build Linux tree
        if: runner.os == 'Linux'
        run: pnpm build:deck

      # Re-run the floor check against the STAGED tree (Vite copies public/assets
      # → dist/assets) so a packaging slip that drops the assets is caught before
      # we tar + attach to a Release.
      - name: Verify staged assets (Linux)
        if: runner.os == 'Linux'
        env:
          ASSET_DIR: dist/assets
        run: node tools/check-assets-present.mjs

      # tar preserves the executable bit on the `hoverbike` binary — a plain
      # artifact upload (zip) would strip it and Steam would ship a tree that
      # won't launch.
      - name: Package Linux tree
        if: runner.os == 'Linux'
        run: tar -czf hoverbike-linux.tar.gz -C dist-electron linux-unpacked

      - name: Upload Linux tree artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: hoverbike-linux-tree
          path: hoverbike-linux.tar.gz
          if-no-files-found: error
          retention-days: 30

      # ---- Windows: build the NSIS installer + unpacked tree --------------
      - name: Build Windows installer + tree
        if: runner.os == 'Windows'
        run: pnpm build:windows

      # Same staged-tree floor check as the Linux leg (see above).
      - name: Verify staged assets (Windows)
        if: runner.os == 'Windows'
        env:
          ASSET_DIR: dist/assets
        run: node tools/check-assets-present.mjs

      - name: Upload Windows installer artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: hoverbike-windows-installer
          path: dist-electron/*-setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows tree artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: hoverbike-windows-tree
          path: dist-electron/win-unpacked
          if-no-files-found: error
          retention-days: 30

      # ---- Release attach (tag builds only) -------------------------------
      # Each matrix leg attaches whatever it produced; the other file pattern
      # is absent on that leg, hence fail_on_unmatched_files: false.
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hoverbike-linux.tar.gz
            dist-electron/*-setup.exe
          fail_on_unmatched_files: false
